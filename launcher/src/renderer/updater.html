<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'">
  <title>Nore Updater</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="updater.css">
</head>
<body>
  <!-- Nore Updater (DESIGN.md §8): the album cover with a sticker pack; the pack's tear strip is the progress
       bar; at 100 % and a verified SHA-256 the pack opens and the new version sticker sticks out. -->
  <div class="drag"></div>
  <button class="close" id="close" title="Pomiń" aria-label="Pomiń"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <main class="stage">
    <div class="pack" id="pack">
      <div class="flap" id="flap">
        <svg viewBox="0 0 210 34" aria-hidden="true"><path d="M6 14 L12 6 L18 14 L24 6 L30 14 L36 6 L42 14 L48 6 L54 14 L60 6 L66 14 L72 6 L78 14 L84 6 L90 14 L96 6 L102 14 L108 6 L114 14 L120 6 L126 14 L132 6 L138 14 L144 6 L150 14 L156 6 L162 14 L168 6 L174 14 L180 6 L186 14 L192 6 L198 14 L204 6 L204 34 L6 34 Z" class="foil"/><rect x="9" y="16" width="192" height="12" class="seam"/></svg>
      </div>
      <svg class="body" viewBox="0 34 210 218" aria-hidden="true">
        <path d="M6 34 L204 34 L204 238 L198 246 L192 238 L186 246 L180 238 L174 246 L168 238 L162 246 L156 238 L150 246 L144 238 L138 246 L132 238 L126 246 L120 238 L114 246 L108 238 L102 246 L96 238 L90 246 L84 238 L78 246 L72 238 L66 246 L60 238 L54 246 L48 238 L42 246 L36 238 L30 246 L24 238 L18 246 L12 238 L6 246 Z" class="foil"/>
        <rect x="9" y="222" width="192" height="12" class="seam"/>
        <path d="M150 34 L201 34 L201 70 Z" class="sheen"/>
      </svg>
      <div class="tear" id="tear"><span class="torn"></span><span class="rest"></span></div>
      <div class="front">
        <span class="logo-sticker"><img src="assets/album/logo-art.png" alt=""></span>
        <h1 id="title">Nore Launcher</h1>
        <span class="label nore" id="next" hidden></span>
      </div>
      <div class="out" id="out" aria-live="polite"><span class="label nore big" id="outver"></span></div>
    </div>
    <section class="status">
      <b><i class="dot wait" id="dot"></i><span id="status">Uruchamianie…</span></b>
      <div class="progress" id="bar"><i id="fill"></i></div>
      <small><span id="meta"></span><span id="speed"></span></small>
      <ul class="notes" id="notes"></ul>
      <div class="actions">
        <button id="retry" class="btn" hidden>Spróbuj ponownie</button>
        <button id="skip" class="btn quiet" hidden>Pomiń</button>
        <button id="go" class="btn primary" hidden>Dalej</button>
      </div>
    </section>
  </main>
  <footer><span id="hint">noreclient.pl</span><span class="label dark" id="ver"></span></footer>
  <script src="js/updater.js"></script>
</body>
</html>
