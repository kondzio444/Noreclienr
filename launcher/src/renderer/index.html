<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'">
  <title>Nore Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash">
    <div class="inner">
      <img src="assets/logo.png" alt="">
      <div class="name">NORE</div>
      <div class="bar"><i></i></div>
    </div>
  </div>

  <div id="bg">
    <div class="photo"></div>
    <canvas id="embers"></canvas>
    <div class="shade"></div>
  </div>

  <header id="titlebar">
    <div class="brand"><img src="assets/logo.png" alt=""><span><b>NORE</b> LAUNCHER</span></div>
    <div class="spacer"></div>
    <div class="status" id="net-status"><span class="dot"></span><span>Online</span></div>
    <div class="wc">
      <button id="wc-min" title="Minimalizuj"><svg viewBox="0 0 24 24" class="i"><path d="M5 12h14"/></svg></button>
      <button id="wc-max" title="Maksymalizuj"><svg viewBox="0 0 24 24" class="i"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      <button id="wc-close" class="close" title="Zamknij"><svg viewBox="0 0 24 24" class="i"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>

  <div id="app">
    <aside id="sidebar">
      <div class="logo-block">
        <img src="assets/logo.png" alt="">
        <div class="lb-text"><h1>Nore</h1><small>LAUNCHER</small></div>
        <span class="ver-chip">1.4 BETA</span>
      </div>
      <button class="sb-toggle" id="sb-toggle" title="Zwiń / rozwiń menu"><svg viewBox="0 0 24 24" class="i"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="sb-scroll">
        <div class="nav-label">GRA</div>
        <nav class="nav" id="nav-main"></nav>
        <div class="nav-label">ZAWARTOŚĆ</div>
        <nav class="nav" id="nav-content"></nav>
        <div class="nav-label">SPOŁECZNOŚĆ</div>
        <nav class="nav" id="nav-social"></nav>
        <div class="nav-label">LAUNCHER</div>
        <nav class="nav" id="nav-launcher"></nav>
      </div>
      <div class="sidebar-bottom">
        <div class="mini-play" id="mini-play"></div>
        <div class="account-chip" id="account-chip"></div>
      </div>
    </aside>
    <main id="main">
      <div id="view"></div>
    </main>
  </div>

  <div id="toasts"></div>
  <script src="js/ui.js"></script>
  <script src="js/background.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/pages2.js"></script>
  <script src="js/servers.js"></script>
  <script src="js/browse.js"></script>
  <script src="js/appearance.js"></script>
  <script src="js/instances.js"></script>
  <script src="js/doctor.js"></script>
  <script src="js/social.js"></script>
  <script src="js/home14.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
