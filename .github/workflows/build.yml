name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # tagged builds publish the release that the launcher auto-updates from

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Nore Client (all platforms)
        run: ./scripts/build-all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: noreclient-mod
          path: dist/mods/*.jar

  launcher:
    needs: mod
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: launcher/dist/*.exe
          - os: ubuntu-latest
            script: dist:linux
            files: launcher/dist/*.AppImage
          - os: macos-latest
            script: dist:mac
            files: launcher/dist/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: noreclient-mod
          path: dist/mods
      - run: npm ci
      - run: npm test
      - name: Build installer
        # a "v*" tag (e.g. v1.2.0) publishes a GitHub release with latest.yml for auto-update
        run: npm run ${{ matrix.script }} -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: nore-launcher-${{ matrix.os }}
          path: ${{ matrix.files }}
