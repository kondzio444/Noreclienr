// Root build: "./gradlew build" builds every Nore Client platform (platforms/<name>/, one per
// group of Minecraft versions) into dist/mods/noreclient-<name>.jar, which the launcher bundles.
rootProject.name = 'noreclient'

// platforms with their own gradlew (26.x+, Gradle 9 / Java 25) are built separately by scripts/build-all.sh
file('platforms').listFiles().findAll { new File(it, 'settings.gradle').exists() && !new File(it, 'gradlew').exists() }.sort().each {
    includeBuild(it)
}
