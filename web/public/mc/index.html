  h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .5rem; }
  p { color: var(--muted); margin: .25rem 0; }
  code { color: var(--accent); font-size: 1.1rem; }
  #st { margin-top: 1.25rem; }
</style>
</head>
<body>

  <h1>Serwer Nore</h1>

<script src="/status.js" defer></script>
</body>
