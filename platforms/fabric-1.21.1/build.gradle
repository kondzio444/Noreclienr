plugins {
    id 'fabric-loom' version "${loom_version}"
}

apply from: '../shared.gradle'

repositories {
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

// ./gradlew -p platforms/fabric-1.21.1 runClient -PperfMods : test together with the performance
// mods the launcher installs next to Nore Client (not part of the built jar). FerriteCore is left
// out: it only loads with production mappings.
if (project.hasProperty('perfMods')) {
    dependencies {
        modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:0.116.7+1.21.1"
        modRuntimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"
        modRuntimeOnly "maven.modrinth:lithium:mc1.21.1-0.14.8-fabric"
        modRuntimeOnly "maven.modrinth:entityculling:1.7.2"
        modRuntimeOnly "maven.modrinth:immediatelyfast:1.3.0+1.21.1-fabric"
    }
}
